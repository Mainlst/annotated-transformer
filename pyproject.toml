[project]
name = "annotated-transformer"
version = "0.1.0"
description = "Code for The Annotated Transformer"
requires-python = ">=3.9,<3.10"
dependencies = [
    "numpy<1.24",
    "pandas==1.3.5",
    "torch==1.11.0+cu113",
    "torchdata==0.3.0",
    "torchtext==0.12",
    "spacy==3.2",
    "altair==4.1",
    "jupytext==1.13",
    "flake8",
    "black",
    "GPUtil",
    "wandb<0.18",
    "notebook>=7.1.3",
    "tqdm>=4.70.1",
]

[tool.uv]
find-links = ["https://download.pytorch.org/whl/torch_stable.html"]
